[package]
name = "imas-middleware"
version = "0.1.0"
edition = "2021"
rust-version = "1.76.0"
publish = false
description = "Interception layer between al-fortran's low-level bindings and al-core's C API"

# A staticlib, not a cdylib: the shim is baked into libal-fortran itself, so an
# installed prefix stays self-contained and no consumer of al-fortran (playground
# programs, tests, examples) has to learn about a second shared object or carry an
# extra rpath. aarch64-apple-darwin and x86-64 Linux both produce PIC objects by
# default, which is what linking into a shared al-fortran requires.
[lib]
name = "imas_middleware"
crate-type = ["staticlib"]

[profile.release]
# The shim sits on the read path of every scalar and array in an IDS, so it is
# built optimized even when al-fortran itself is a Debug build; debug = true keeps
# it steppable in gdb/lldb alongside the Fortran frames it sits between.
debug = true

# Unwinding out of the `extern "C"` shim into Fortran is not a thing this crate is
# allowed to do (see the rules in src/lib.rs), so drop the machinery for it: a panic
# aborts instead, which is the same outcome the compiler already forces at an
# `extern "C"` boundary but stated at the toolchain level, and it takes the landing
# pads and unwind tables out of the archive. Only the release profile — `cargo test`
# builds the dev profile, where the harness needs unwinding to report a failure.
panic = "abort"
